baseURL: https://checheta.com/
title: Тетяна Дем'яненко
timeZone: Europe/Kyiv
locale: uk
defaultContentLanguage: uk
defaultContentLanguageInSubdir: false
languages:
  uk:
    weight: 1
    label: Українська
disableKinds: [taxonomy, term]
enableRobotsTXT: true
# Enter у тексті сторінок — новий рядок (без двох пробілів у кінці, як вимагає Markdown)
markup:
  goldmark:
    renderer:
      hardWraps: true

module:
  imports:
    - path: github.com/PerVenT/hugo-checheta-theme

params:
  description: Наставництво «4 кроки до мрії», гра «Алмазна мудрість» і безкоштовні уроки від Тетяни Дем'яненко
  brand: CHECHETA | 
  role: твоя наставниця Таня · кармолог
  avatar: images/avatar.jpg
  # og_image: images/og.jpg # прев'ю посилань у соцмережах; без нього — головне фото (hero), обрізане до 1200×630
  email: "info@checheta.com"
  telegram:
    username: "tanyachecheta" # TODO: Telegram Тані без @ — кнопки «Хочу поговорити» й «Написати в Telegram»
  telegram_channel: "https://t.me/+OegpKoW3-CsxYzhi" # TODO: посилання на Telegram-канал, https://t.me/...
  bot:
    username: "checheta_support_bot" # етап 3: бот підтвердження оплати
  forms:
    endpoint: "https://auto.pervent.dev/webhook/3mlvckEztfezX54w"
  api:
    endpoint: "https://auto.pervent.dev/webhook/wfp-checkout" # n8n «Оформлення оплати»: підписане замовлення WayForPay з UTM для payment.mode: checkout
  umami:
    src: "https://seo.pervent.dev/colours.js" # TODO: https://<інстанс Umami>/script.js
    id: "01a14710-b793-7429-a0d9-11d7577e9a2e" # TODO: website-id з Umami
  gtag:
    id: ""
  # Короткі посилання на сторінки цього сайту: checheta.com/ig/ → сторінка з UTM-мітками (перехід рахує сама сторінка)
  # Мітки: utm_source — платформа, utm_medium — місце (bio, stories, post, video, channel, live),
  # utm_campaign — куди веде або що рекламує (links, urok-1, trening, назва посту).
  shortlinks:
    ig: /links/?utm_source=instagram&utm_medium=bio&utm_campaign=links
    igs: /links/?utm_source=instagram&utm_medium=stories&utm_campaign=links
    urok: /lessons/urok-1/?utm_source=instagram&utm_medium=stories&utm_campaign=urok-1
    i: /lessons/urok-1/?utm_source=instagram&utm_medium=stories&utm_campaign=greeting
    web: /products/webinar-4-kroky/?utm_source=webinar&utm_medium=social&utm_campaign=sale
    yt: /links/?utm_source=youtube&utm_medium=video&utm_campaign=links
    tg: /links/?utm_source=telegram&utm_medium=channel&utm_campaign=links
    tt: /links/?utm_source=tiktok&utm_medium=bio&utm_campaign=links
  # Посилання на інші сайти: checheta.com/go/instagram/ → instagram.com (клік рахується в Umami подією outlink-click)
  # /go/telegram/ тема додає сама з telegram.username
  outlinks:
    instagram: https://instagram.com/tanyachecheta
    youtube: https://youtube.com/@tanyachecheta
    tiktok: https://www.tiktok.com/@tanyachecheta

